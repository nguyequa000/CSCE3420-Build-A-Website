<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="workspaceTitle workspaceDesc">
  <title id="workspaceTitle">Illustration of a coding workspace</title>
  <desc id="workspaceDesc">A stylized desk with a laptop, coffee cup, and plant in a purple, indigo, and light palette. Decorative illustration, not a portrait.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f0ff"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3fa8"/>
      <stop offset="100%" stop-color="#3b2a6b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2440"/>
      <stop offset="100%" stop-color="#1b1530"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f42c1"/>
      <stop offset="100%" stop-color="#5a34a0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Soft decorative circles -->
  <circle cx="120" cy="90" r="60" fill="#d9ccff" opacity="0.5"/>
  <circle cx="690" cy="110" r="46" fill="#c5b3ff" opacity="0.45"/>
  <circle cx="720" cy="500" r="70" fill="#e2d9ff" opacity="0.4"/>

  <!-- Desk -->
  <rect x="60" y="390" width="680" height="26" rx="13" fill="url(#desk)"/>
  <rect x="100" y="416" width="24" height="120" rx="8" fill="#3b2a6b"/>
  <rect x="676" y="416" width="24" height="120" rx="8" fill="#3b2a6b"/>

  <!-- Laptop base -->
  <rect x="230" y="360" width="340" height="34" rx="6" fill="url(#laptop)"/>
  <rect x="250" y="366" width="300" height="6" rx="3" fill="#b9a7e8" opacity="0.6"/>

  <!-- Laptop screen -->
  <rect x="250" y="190" width="300" height="180" rx="12" fill="url(#screen)" stroke="#6f42c1" stroke-width="6"/>
  <!-- Screen bezel highlight -->
  <rect x="262" y="202" width="276" height="156" rx="6" fill="#211a3a"/>

  <!-- Code lines -->
  <rect x="278" y="220" width="120" height="8" rx="4" fill="#a78bfa"/>
  <rect x="278" y="240" width="180" height="8" rx="4" fill="#c4b5fd"/>
  <rect x="294" y="260" width="150" height="8" rx="4" fill="#93c5fd"/>
  <rect x="294" y="280" width="100" height="8" rx="4" fill="#a78bfa"/>
  <rect x="278" y="300" width="200" height="8" rx="4" fill="#c4b5fd"/>
  <rect x="294" y="320" width="130" height="8" rx="4" fill="#93c5fd"/>
  <rect x="278" y="340" width="90" height="8" rx="4" fill="#a78bfa"/>

  <!-- Coffee cup -->
  <g transform="translate(600,330)">
    <ellipse cx="40" cy="62" rx="34" ry="8" fill="#3b2a6b" opacity="0.25"/>
    <rect x="12" y="18" width="56" height="46" rx="8" fill="#ffffff" stroke="#6f42c1" stroke-width="3"/>
    <path d="M68,28 Q86,28 86,42 Q86,56 68,56" fill="none" stroke="#6f42c1" stroke-width="3" stroke-linecap="round"/>
    <rect x="16" y="22" width="48" height="6" rx="3" fill="#e9d5ff"/>
    <!-- steam -->
    <path d="M28,12 Q30,2 34,12" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <path d="M42,10 Q44,0 48,10" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Plant -->
  <g transform="translate(110,300)">
    <rect x="20" y="52" width="40" height="34" rx="6" fill="#6f42c1"/>
    <ellipse cx="40" cy="52" rx="22" ry="6" fill="#5a34a0"/>
    <path d="M40,52 Q20,10 10,30 Q22,26 40,52" fill="#8b5cf6"/>
    <path d="M40,52 Q60,8 70,30 Q58,28 40,52" fill="#a78bfa"/>
    <path d="M40,52 Q40,-4 46,18 Q42,22 40,52" fill="#c4b5fd"/>
  </g>

  <!-- Keyboard hint on base -->
  <rect x="280" y="372" width="240" height="12" rx="6" fill="#4c3a7a" opacity="0.7"/>
  <circle cx="300" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="320" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="340" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="360" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="380" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="400" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="420" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="440" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="460" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="480" cy="378" r="2" fill="#b9a7e8"/>
  <circle cx="500" cy="378" r="2" fill="#b9a7e8"/>

  <!-- Mouse -->
  <ellipse cx="600" cy="378" rx="18" ry="10" fill="#6f42c1"/>
  <line x1="600" y1="370" x2="600" y2="386" stroke="#b9a7e8" stroke-width="1.5"/>
</svg>
